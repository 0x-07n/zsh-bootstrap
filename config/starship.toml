add_newline = true

scan_timeout = 200
command_timeout = 1000

format = """
╭─$username$hostname$directory$git_branch$git_status$terraform$kubernetes$python$nodejs$docker_context$cmd_duration
╰─$character
"""


[username]
show_always = true
style_user = "bold cyan"
style_root = "bold red"
format = "[ $user]($style)"


[hostname]
ssh_only = false
style = "bold cyan"
format = "[@$hostname]($style) "
trim_at = "."


[directory]
style = "bold blue"
format = "[ $path]($style) "
truncation_length = 4
truncate_to_repo = false
home_symbol = "~"
read_only = " "


[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "


[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style)) "

conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}/${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"


[terraform]
symbol = "󱁢 "
style = "bold purple"
format = "[$symbol$version]($style) "


[kubernetes]
disabled = false
symbol = "☸ "
style = "bold blue"
format = "[$symbol$context]($style) "


[docker_context]
symbol = " "
style = "blue"
format = "[$symbol$context]($style) "


[python]
symbol = " "
style = "yellow"
format = "[$symbol$version]($style) "


[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "


[cmd_duration]
min_time = 1500
style = "yellow"
format = "[󱎫 $duration]($style) "


[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
